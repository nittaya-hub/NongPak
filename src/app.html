<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Koel">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light only">
<meta name="description" content="Koel แอปเรียนภาษาจีน เยอรมัน อังกฤษ ฝรั่งเศส และไทย แบบพูดได้จริง ใช้ฟรี">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Koel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+Thai+Looped:wght@400&family=Noto+Serif+SC:wght@600;800&display=swap">
<style>
/* Layout: a pocket phrasebook app. One column, bottom tab bar, the phrase is always the biggest thing on screen. */
:root{
  --paper:#ffffff; --card:#ffffff; --ink:#1d1c1a; --muted:#6b6862; --line:#e6e3dc; --soft:#f4f2ed;
  --zh:#cf3b2a; --de:#c08a12; --en:#2463c9;--th:#16846b; --fr:#7a3fb8; --good:#2f8a55; --hard:#b98015; --again:#c2483d; --xp:#6b4fd8;
  --accent:var(--zh); --accent-soft:color-mix(in srgb,var(--accent) 11%,var(--card)); --on-accent:#fff;
  --f-th:"IBM Plex Sans Thai",system-ui,sans-serif; --f-lat:"Fraunces",Georgia,serif; --f-han:"Noto Serif SC","Songti SC",serif;
  color-scheme:light;
}
body[data-lang="de"]{--accent:var(--de)}
body[data-lang="en"]{--accent:var(--en)}
body[data-lang="th"]{--accent:var(--th)}
body[data-lang="fr"]{--accent:var(--fr)}
body{--accent-soft:color-mix(in srgb,var(--accent) 11%,var(--card))}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper);overflow-x:hidden}
.stage>*,.foot>*,.panel>*{max-width:100%;min-width:0}
p,span,b,small,.opt,.tip,.hint{overflow-wrap:anywhere}
body{color:var(--ink);font-family:var(--f-th);font-size:16px;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
button{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.han{font-family:var(--f-han)} body[data-lang="de"] .han,body[data-lang="en"] .han,body[data-lang="fr"] .han{font-family:var(--f-lat)}
body[data-lang="th"] .han,body[data-lang="th"] .seal,body[data-lang="th"] .tile .ic,body[data-lang="th"] .glyph{font-family:var(--f-th)}
/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.seal{width:40px;height:40px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:800 21px var(--f-han);flex:none}
body[data-lang="de"] .seal,body[data-lang="en"] .seal{font-family:var(--f-lat);font-size:18px}
.brand b{display:block;font-size:17px;line-height:1.2}
.brand small{color:var(--muted);font-size:12.5px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.seg button{border:0;background:none;color:var(--muted);font-weight:600;font-size:13.5px;padding:6px 10px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
/* bottom tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:560px}
nav.tabs button{border:0;background:none;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;min-width:0}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
/* cards & bits */
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.row-flex{display:flex;align-items:center;gap:12px}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:13.5px;margin:0}
h2{font-size:16px;margin:0}
.primary{background:var(--accent);color:var(--on-accent);border:0;border-radius:14px;font-weight:700;font-size:17px;padding:15px 18px;cursor:pointer;width:100%;box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.primary:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.primary:disabled{opacity:.45;cursor:default;box-shadow:none}
.ghost{background:var(--card);border:1px solid var(--line);border-radius:12px;font-weight:600;font-size:14px;padding:9px 14px;cursor:pointer}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:13.5px;cursor:pointer;padding:4px 0}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600}
.chip.ok{background:color-mix(in srgb,var(--good) 14%,var(--card));color:var(--good)}
.chip.warn{background:color-mix(in srgb,var(--hard) 16%,var(--card));color:var(--hard)}
.bar{height:8px;background:var(--soft);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:8px;transition:width .4s}
/* goal picker */
.goals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.goal{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:14px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.goal b{font:800 30px var(--f-lat);line-height:1;color:var(--accent)}
.goal span{font-weight:700}
.goal small{color:var(--muted);font-size:12.5px;line-height:1.45}
.goal[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
/* today hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .t b{font:800 22px var(--f-lat);display:block;font-variant-numeric:tabular-nums}
.ring .t small{font-size:11px;color:var(--muted)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{background:var(--soft);border-radius:12px;padding:8px 10px}
.st b{font:800 20px var(--f-lat);display:block;font-variant-numeric:tabular-nums;line-height:1.15}
.st small{font-size:12px;color:var(--muted)}
.flame{color:#e46a1f}
/* path */
.path{display:flex;flex-direction:column;gap:0}
.node{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:8px 0;background:none;border:0;text-align:left;cursor:pointer;width:100%;position:relative}
.node .dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--soft);color:var(--muted);border:2px solid var(--line);position:relative;z-index:1}
.node.done .dot{background:var(--good);border-color:var(--good);color:#fff}
.node.now .dot{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 0 0 5px var(--accent-soft)}
.node:not(:last-child)::after{content:"";position:absolute;left:19px;top:44px;bottom:-4px;width:2px;background:var(--line)}
.node .nm{font-weight:600;font-size:15px;min-width:0}
.node .nm small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.node .pc{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
/* study */
.study{position:fixed;inset:0;z-index:30;background:var(--paper);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.study .top{display:flex;align-items:center;gap:12px;max-width:560px;width:100%;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.x{width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);cursor:pointer;font-size:20px;line-height:1;flex:none}
.study .top .bar{flex:1;height:12px}
.combo{font-weight:700;color:var(--xp);font-size:14px;min-width:46px;text-align:right;font-variant-numeric:tabular-nums}
.stage{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;max-width:560px;width:100%;margin:0 auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.mode{align-self:flex-start;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 12px;font-weight:700;font-size:13px}
.ask{font-size:20px;font-weight:700;margin:0;text-wrap:balance}
.big{font-weight:800;font-size:clamp(34px,10vw,50px);line-height:1.2;text-wrap:balance;margin:0;overflow-wrap:anywhere}
body[data-lang="de"] .big,body[data-lang="en"] .big,body[data-lang="th"] .big{font-size:clamp(28px,8vw,40px)}
.roman{font-family:var(--f-lat);font-size:19px;color:var(--accent);margin:0}
.pron{font-size:17px;color:var(--muted);margin:0}
.mean{font-size:22px;font-weight:700;margin:0;text-wrap:balance}
.tip{font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0}
.tip b{color:var(--accent)}
.exbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.exbox .han{font-size:18px;font-weight:600}
.exbox small{display:block;color:var(--muted);font-size:13.5px}
.reveal{display:flex;flex-direction:column;gap:6px;text-align:center;padding:10px 0}
.audio{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.play{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer}
.play svg{width:18px;height:18px;fill:currentColor}
.play.huge{width:110px;height:110px;border-radius:50%;justify-content:center;border-color:var(--accent);color:var(--accent);padding:0;margin:8px auto}
.play.huge svg{width:44px;height:44px}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);border-bottom-width:4px;background:var(--card);border-radius:14px;padding:13px 14px;text-align:left;font-size:16.5px;font-weight:600;cursor:pointer}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--card))}
.opt.wrong{border-color:var(--again);background:color-mix(in srgb,var(--again) 10%,var(--card))}
.opt:disabled{cursor:default}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.hearts{letter-spacing:1px}
.foot{max-width:560px;width:100%;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--card)}
.foot.good{background:color-mix(in srgb,var(--good) 12%,var(--card))}
.foot.bad{background:color-mix(in srgb,var(--again) 10%,var(--card))}
.fbline{font-weight:700;margin:0 0 10px;font-size:16px}
.foot.good .fbline{color:var(--good)} .foot.bad .fbline{color:var(--again)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{border:2px solid var(--line);border-bottom-width:4px;background:var(--card);border-radius:14px;padding:10px 4px;cursor:pointer;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center}
.rate button small{font-weight:400;font-size:12px;color:var(--muted)}
.rate .r0{border-color:var(--again);color:var(--again)} .rate .r1{border-color:var(--hard);color:var(--hard)} .rate .r2{border-color:var(--good);color:var(--good)}
.done{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:30px}
.done .xp{font:800 56px var(--f-lat);color:var(--xp);line-height:1}
.done .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;width:100%;height:100%}
/* library */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0}
.tile .ic{font:800 22px var(--f-han);color:var(--accent)}
body[data-lang="de"] .tile .ic,body[data-lang="en"] .tile .ic{font-family:var(--f-lat)}
.tile b{font-size:14.5px;line-height:1.35}
.tile small{color:var(--muted);font-size:12.5px}
.tile .bar{height:6px}
.tile.pri{border:2px solid var(--accent)}
.sec{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:6px 0 -4px}
.list{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.item:first-child{border-top:0}
.item .t{font-weight:700;font-size:21px;min-width:0;overflow-wrap:anywhere}
body[data-lang="de"] .item .t,body[data-lang="en"] .item .t,body[data-lang="th"] .item .t{font-size:18px}
.item .s{grid-column:1;font-size:13.5px;color:var(--muted);min-width:0}
.item .s em{font-style:normal;font-family:var(--f-lat);color:var(--accent)}
.item .m{grid-column:1;font-size:15px}
.item .e{grid-column:1;font-size:13.5px;color:var(--muted)}
.item .side{grid-row:1 / span 4;grid-column:2;display:flex;flex-direction:column;align-items:center;gap:6px}
.lvl{display:flex;gap:2px}.lvl i{width:6px;height:6px;border-radius:2px;background:var(--line)}.lvl i.on{background:var(--good)}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--accent);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:19px;height:19px;fill:currentColor}
.back{display:flex;align-items:center;gap:8px}
form.add{display:grid;gap:10px}
form.add label{display:grid;gap:4px;font-size:13.5px;font-weight:600}
form.add input,form.add select{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 12px;font:400 16px var(--f-th);min-width:0}
/* chat */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip-btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px;cursor:pointer}
.chip-btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;border-radius:16px;padding:10px 13px;display:flex;flex-direction:column;gap:3px;min-width:0}
.msg.bot{background:var(--card);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--accent);color:var(--on-accent);align-self:flex-end;border-bottom-right-radius:4px}
.msg .mt{font-size:20px;font-weight:700;overflow-wrap:anywhere}
.msg .mr{font-family:var(--f-lat);color:var(--accent);font-size:14.5px}
.msg .mp,.msg .mm{font-size:14px;color:var(--muted)}
.msg .fb{font-size:13.5px;background:var(--accent-soft);border-radius:8px;padding:6px 9px}
.sugg{display:flex;flex-direction:column;gap:6px}
.sugg button{text-align:left;border:1px dashed var(--line);background:none;border-radius:12px;padding:8px 12px;cursor:pointer;font-size:14px}
.sugg button b{font-size:16px;margin-right:6px}
.composer{display:flex;gap:8px}
.composer input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;font:400 16px var(--f-th)}
.composer .primary{width:auto;padding:12px 18px;font-size:15px}
.empty{border:1px dashed var(--line);border-radius:16px;padding:18px;color:var(--muted);font-size:14px;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw;text-align:center}
.sync{font-size:12px;color:var(--muted);text-align:center}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.pop{animation:pop .3s ease-out}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* v9 additions */
header{flex-wrap:wrap}
.reg{display:inline-block;border-radius:999px;padding:0 8px;font-size:11.5px;font-weight:700;line-height:1.7;vertical-align:middle;margin-left:4px;white-space:nowrap}
.reg.polite{background:#e8f1fb;color:#1f5fa8}.reg.casual{background:#fdeee6;color:#b4521f}.reg.work{background:#ecebfa;color:#4b3db3}.reg.sx-m{background:#e3f0ff;color:#1b5fae}.reg.sx-f{background:#ffe6f1;color:#b02a6b}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer}
.filters button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.knownbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;cursor:pointer;align-self:center}
.knownbtn[aria-pressed="true"]{background:color-mix(in srgb,var(--good) 14%,var(--card));border-color:var(--good);color:var(--good)}
.mini{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:14px;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.mini[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.gapline{font-size:22px;font-weight:700;text-align:center;margin:0;text-wrap:balance}
.gapline u{text-decoration:none;display:inline-block;min-width:70px;border-bottom:3px solid var(--accent);color:var(--accent)}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.acell{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.acell b{font:700 24px var(--f-lat);line-height:1.2;overflow-wrap:anywhere}
body[data-lang="zh"] .acell b{font-family:var(--f-han)}
.acell small{font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.acell.on{border-color:var(--accent)}
.glyph{font:800 clamp(72px,24vw,120px) var(--f-lat);text-align:center;line-height:1.1;margin:0;color:var(--ink)}
body[data-lang="zh"] .glyph{font-family:var(--f-han)}
.trace{position:relative;width:min(100%,300px);aspect-ratio:1;margin:0 auto;border:1px solid var(--line);border-radius:16px;background:
 linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat,linear-gradient(var(--line),var(--line)) center/1px 100% no-repeat,var(--card);overflow:hidden;touch-action:none}
.trace .ghost-ch{position:absolute;inset:0;display:grid;place-items:center;font:400 190px var(--f-han);color:#e9e6df;pointer-events:none;line-height:1}
body:not([data-lang="zh"]) .trace .ghost-ch{font-family:"Comic Sans MS","Chalkboard SE",var(--f-lat);font-size:170px}
body[data-lang="th"] .trace .ghost-ch{font-family:"Noto Sans Thai Looped",var(--f-th);font-size:150px;line-height:1.4}
body[data-lang="th"] .seal{font-size:22px}
body[data-lang="th"] .tile .ic{font-size:15px}
.trace canvas{position:absolute;inset:0;width:100%;height:100%}
.trace .hw{position:absolute;inset:0}
.chain{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chain span{background:var(--soft);border-radius:999px;padding:3px 10px;font-size:14px}
.chain span:last-child{background:var(--accent);color:var(--on-accent)}
.word-now{font-size:clamp(30px,9vw,44px);font-weight:800;text-align:center;margin:0;overflow-wrap:anywhere}
.word-now mark{background:none;color:var(--accent);text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:6px}
.gcard{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;width:100%}
.gcard .gi{width:48px;height:48px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:800 20px var(--f-han);flex:none}
.gcard b{display:block;font-size:16px}.gcard small{color:var(--muted);font-size:13px}
.src{font-size:11.5px;color:var(--muted)}
.src a{color:var(--muted)}
.scene{position:relative;border-radius:18px;padding:12px;display:flex;align-items:flex-end;gap:6px;min-height:170px;overflow:hidden}
.scene .props span{position:absolute;font-size:30px;animation:sc-float 3s ease-in-out infinite;opacity:.9}
.scene .sc-pk{flex:none;animation:sc-in .5s cubic-bezier(.3,1.4,.5,1) both}
.scene .bubble{position:relative;z-index:1;background:#fff;border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;box-shadow:0 2px 0 rgba(0,0,0,.06);margin-bottom:40px;animation:sc-pop .35s .35s both;min-width:0;flex:1}
.scene .bubble::before{content:"";position:absolute;left:-8px;bottom:14px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.scene .bubble small{color:var(--muted);font-size:12px;font-weight:600}.scene .bubble b{font-size:16.5px;line-height:1.35}.scene .bubble span{font-size:13.5px;color:var(--muted)}
@keyframes sc-float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
@keyframes sc-in{from{transform:translateX(-80px) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes sc-pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.brand .seal{background:none!important;width:44px;height:44px;overflow:visible}
#gate{position:fixed;inset:0;z-index:100;background:var(--paper);display:grid;place-items:center;padding:20px;overflow:auto}
.gbox{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.gbox h1{margin:0;font-size:26px}
.gbox .glab{align-self:flex-start;font-weight:600;font-size:14px;margin-top:8px}
.gbox input{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font:400 17px var(--f-th);background:var(--card);color:var(--ink)}
.gbox .gerr{color:var(--again);font-size:14px;margin:0;min-height:20px}
.copy{font-size:12px;color:var(--muted);margin:8px 0 0;text-align:center}
.stage>*{flex-shrink:0}
.study .top,.study .foot{flex-shrink:0}
.study{height:100%;height:100dvh}
.steps .stepgrid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:6px}
.step{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:6px 10px 6px 6px}
.step svg{flex:none}.step b{display:block;font-size:14.5px}.step small{color:var(--muted);font-size:13px}

.filters button.han,.filters [data-hz]{font-family:var(--f-han);font-size:16px}

}

function pickKind(c){

let CH=null;
function chainWords(){
  const out=[];
  for(const c of deck()){
    let w=c.t.replace(/[。，！？、,.!?;:"'“”‘’()（）…]/g,"").trim();
    if(lang==="zh"){if(w.length<2||w.length>6||![...w].every(isHan))continue;out.push({c,w,f:w[0],l:w[w.length-1]})}
    else if(lang==="th"){if(/\s/.test(w)||!/^[\u0E00-\u0E7F]+$/.test(w)||w.length>8)continue;const cs=w.match(/[ก-ฮ](?![์])/g);if(!cs||cs.length<2)continue;out.push({c,w,f:cs[0],l:cs[cs.length-1]})}
    else{w=w.replace(/^(der|die|das)\s+/i,"");const ws=w.split(/\s+/);if(ws.length>3||!w)continue;
      const f=(w.match(/[a-zäöüßàâçéèêëîïôûùÿœæ]/i)||[""])[0].toLowerCase(),l=(w.match(/[a-zäöüßàâçéèêëîïôûùÿœæ](?=[^a-zäöüßàâçéèêëîïôûùÿœæ]*$)/i)||[""])[0].toLowerCase();if(!f||!l)continue;out.push({c,w,f,l})}

  CH=null;$("#cq").onclick=closeStudy;$("#cclose").onclick=closeStudy;$("#cagain").onclick=startChain;
  if(xp>=20)confetti();
}

/* ---------- chat ---------- */
const SCENES=[
  {id:"meet",tp:"s_friend",th:"เจอเพื่อนใหม่",en:"Meeting someone new at a café; you are a friendly local who asks the learner's name, where they are from, their job and hobbies, and suggests exchanging contacts."},
  {id:"travel",tp:"s_travel",th:"เดินทาง ถามทาง",en:"Traveling; you play hotel receptionist, taxi driver or a passer-by. The learner checks in, asks directions or buys a ticket."},
  {id:"food",tp:"s_resto",th:"ร้านอาหาร",en:"Restaurant; you are the waiter: greet, take the order, ask about spice level, allergies and drinks, then bring the bill."},
  {id:"meeting",tp:"s_meet",th:"ประชุมงาน",en:"A short work meeting; you are a colleague/manager. Open the meeting, ask the learner's opinion, ask for clarification and agree on next steps. Use polite workplace language."},
  {id:"nego",tp:"s_nego",th:"เจรจาต่อรอง",en:"A business negotiation; you are a supplier. Discuss price, quantity, delivery date and discount; make counter-offers and try to close the deal politely."}
];
let scene=null,log=[],sampler,busy=false;
async function getSampler(){if(sampler!==undefined)return sampler;try{sampler=window.claude?await claude.use("sample"):null}catch(e){sampler=null}return sampler}
function viewChat(){
  const v=$("#view");
  v.innerHTML=`<div style="display:flex;flex-direction:column;gap:12px">
    <p class="hint">เลือกสถานการณ์ แล้วคุยกับคู่ฝึก พิมพ์ภาษา${DATA[lang].name}${lang==="zh"?" พินอินไม่ใส่วรรณยุกต์":""} หรือพิมพ์ไทยตอนนึกไม่ออกก็ได้ คู่ฝึกจะช่วยแก้ให้</p>
    <div class="chips">${SCENES.map(s=>`<button class="chip-btn" data-sc="${s.id}" aria-pressed="${scene===s.id}">${s.th}</button>`).join("")}</div>
    <div class="chat" id="chat"></div><div class="sugg" id="sugg"></div>
    <form class="composer" id="comp"><input id="chat-in" autocomplete="off" placeholder="พิมพ์คำตอบ"><button class="primary" type="submit">ส่ง</button></form></div>`;
  v.querySelectorAll("[data-sc]").forEach(b=>b.onclick=()=>{scene=b.dataset.sc;log=[];viewChat();ask()});
  $("#comp").onsubmit=e=>{e.preventDefault();const t=$("#chat-in").value.trim();if(!t||busy)return;if(!scene){scene=SCENES[0].id}log.push({role:"me",text:t});$("#chat-in").value="";addXP(3);save();ask()};
  drawChat();
}
function drawChat(){
  const el=$("#chat");if(!el)return;
  if(!scene){el.innerHTML=`<div class="empty">เลือกสถานการณ์ด้านบน คู่ฝึกจะเริ่มพูดก่อนด้วยประโยคง่าย ๆ พร้อมคำแปล คำอ่าน และตัวเลือกว่าควรตอบอะไร คุยหนึ่งครั้งได้ 3 XP</div>`;$("#sugg").innerHTML="";return}
  el.innerHTML="";
  for(const m of log){const d=document.createElement("div");d.className="msg "+(m.role==="me"?"me":"bot");
    const add=(c,t)=>{if(!t)return;const x=document.createElement("div");x.className=c;x.textContent=t;d.appendChild(x)};
    if(m.role==="me")add("",m.text);
    else{add("fb",m.feedback_th);add("mt han",m.reply);add("mr",m.roman);add("mp",m.thai_pron);add("mm",m.meaning_th);
      if(hasTTS&&m.reply){const t=document.createElement("div");t.className="audio";t.style.justifyContent="flex-start";t.innerHTML=`<button class="play" data-say="${esc(m.reply)}">${ICON_PLAY} ฟัง</button><button class="play" data-say="${esc(m.reply)}" data-slow="1">${ICON_SLOW} ช้า</button>`;d.appendChild(t)}}
    el.appendChild(d)}
  if(busy){const d=document.createElement("div");d.className="msg bot";d.innerHTML='<div class="mm">กำลังพิมพ์…</div>';el.appendChild(d)}
  const last=[...log].reverse().find(m=>m.role==="bot"),sg=$("#sugg");sg.innerHTML="";
  if(last&&last.suggestions&&!busy){const p=document.createElement("p");p.className="hint";p.textContent="ตอบแบบนี้ได้ แตะเพื่อใส่ในช่องพิมพ์ แล้วพูดออกเสียงก่อนส่ง";sg.appendChild(p);
    for(const s of last.suggestions.slice(0,3)){const b=document.createElement("button");b.type="button";const bb=document.createElement("b");bb.className="han";bb.textContent=s.text;b.appendChild(bb);b.appendChild(document.createTextNode((s.roman?s.roman+" · ":"")+(s.meaning_th||"")));b.onclick=()=>{$("#chat-in").value=s.text;speak(s.text)};sg.appendChild(b)}}
}
function prompt(){
  const L=DATA[lang],sc=SCENES.find(s=>s.id===scene),zh=lang==="zh",target=LNAME[lang];
  const learned=deck().filter(c=>st(c.id)).map(c=>c.t).slice(0,80);
  const known=(learned.length?learned:deck().filter(c=>c.g===sc.tp).map(c=>c.t)).join(" | ");
  const tr=log.map(m=>m.role==="me"?"LEARNER: "+m.text:"PARTNER: "+m.reply).join("\n")||"(no messages yet; open the conversation with a short greeting that fits the scene)";
  return`You are a warm, patient conversation partner for a Thai native speaker who is a beginner in ${target} (HSK1-2 / CEFR A1-A2). Their goal is to actually communicate.
Scene: ${sc.en}
Phrases the learner already knows (reuse them as much as possible): ${known}
Rules:
- Stay in role. Reply in ${target} only, 1-2 very short sentences, beginner words, and end with a question so the learner must answer.
- The learner may write in ${target}${zh?", in pinyin without tones,":""} or in Thai when stuck. If they used Thai or made a mistake, write a short, kind correction in Thai in feedback_th showing the correct ${target} sentence; otherwise feedback_th is "".
- thai_pron = pronunciation in Thai script the way Thai learners write it (e.g. ${zh?"หนี่ ห่าว":lang==="de"?"วี เกทส์":"ไนซ์ ทู มีท ยู"}).
- roman = ${zh?"Hanyu Pinyin with tone marks":lang==="de"?"simple English-style guide like 'vee gayts'":"the same English sentence with the stressed words in CAPITALS"}.
- suggestions = 2 or 3 short natural things the learner could say next, each with roman and Thai meaning.
Return ONLY JSON: {"reply":"","roman":"","thai_pron":"","meaning_th":"","feedback_th":"","suggestions":[{"text":"","roman":"","meaning_th":""}]}

Conversation so far:
${tr}`;
}
async function ask(){
  const s=await getSampler();
  if(!s){log.push({role:"bot",meaning_th:"การฝึกคุยต้องเปิดหน้านี้ผ่าน Claude ขณะลงชื่อเข้าใช้ ส่วนรอบทบทวนและคลังประโยคใช้ได้ตามปกติ"});drawChat();return}
  busy=true;drawChat();
  try{const r=await s.json(prompt(),{cache:false});busy=false;log.push(Object.assign({role:"bot"},r));drawChat();if(r.reply)speak(r.reply)}
  catch(e){busy=false;log.push({role:"bot",meaning_th:e&&e.code==="not_granted"?"ยังไม่ได้อนุญาตให้หน้านี้ถาม Claude ส่งอีกครั้งแล้วเลือกอนุญาต":e&&e.code==="rate_limited"?"ส่งถี่ไปหน่อย รอสักครู่แล้วลองใหม่":"คู่ฝึกตอบไม่สำเร็จ ลองส่งอีกครั้ง"});drawChat()}
}

/* ---------- password gate ---------- */
const PWK="nongpak-pw";
async function decryptData(pw){
  const b64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(ENC.s),iterations:ENC.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(ENC.iv)},key,b64(ENC.d));
  const ds=new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(ds).text());
}
async function tryUnlock(pw){const o=await decryptData(pw);DATA=o.DATA;ALPHA=o.ALPHA;HANZI=o.HANZI;AIDX=o.AIDX;window.CHARINFO=o.CHARINFO||{};try{localStorage.setItem(PWK,pw)}catch(e){};const g=$("#gate");if(g)g.remove();document.body.style.overflow="";render()}
async function gateBoot(){
  let saved=null;try{saved=localStorage.getItem(PWK)}catch(e){}
  if(saved){try{await tryUnlock(saved);return}catch(e){try{localStorage.removeItem(PWK)}catch(_){}}}
  const g=document.createElement("div");g.id="gate";document.body.appendChild(g);document.body.style.overflow="hidden";
  const draw=(st,msg)=>{g.innerHTML=`<form class="gbox" id="gform" autocomplete="off">${mascot(st,120)}<h1>Koel</h1><p class="hint">เรียนจีน เยอรมัน อังกฤษ ไทย แบบพูดได้จริง</p>
    <label for="gpw" class="glab">รหัสผ่านเข้าใช้งาน</label><input id="gpw" type="password" autocomplete="current-password" placeholder="กรอกรหัสผ่าน" required>
    <p class="gerr" role="alert">${msg||""}</p><button class="primary" type="submit">เข้าใช้งาน</button>
    <p class="copy">© 2026 Koel สงวนลิขสิทธิ์</p></form>`;
    $("#gform").onsubmit=async e=>{e.preventDefault();const pw=$("#gpw").value;const btn=g.querySelector("button");btn.disabled=true;btn.textContent="กำลังเปิด…";
      try{await tryUnlock(pw)}catch(err){draw("oops","รหัสผ่านไม่ถูกต้อง ลองใหม่อีกครั้ง")}};
    setTimeout(()=>{const i=$("#gpw");if(i)i.focus()},50)};
  draw("idle");
}
